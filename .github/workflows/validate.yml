name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint, format, tests, marketplace validation and devflow build check
        run: npm run check

      - name: Skill eval harness tests
        run: |
          python3 -B -m unittest discover -s evals -p 'test_workflow_evaluators.py'
          python3 -B -m unittest discover -s evals/frontend-craft -p 'test_*.py'
